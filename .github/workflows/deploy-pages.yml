name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm --prefix frontend install

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://ai-automation-cxjp.onrender.com/api/v1
          VITE_SERVER_URL: https://ai-automation-cxjp.onrender.com
          VITE_SUPABASE_URL: https://vohalwfvumoshpkphnpl.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvaGFsd2Z2dW1vc2hwa3BobnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNDQyNTgsImV4cCI6MjEwNzYyMDI1OH0.XiQZ5hZIkVQKCBU4rvdUlWbOCjhLrPsE-SSEXChKJ80
        run: |
          npm --prefix frontend run build
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
